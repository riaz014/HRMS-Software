<section class="dashboard-shell">
  <header>
    <h1>HRMS Control Center</h1>
    <p>Use the modules below to manage employees, salaries, and monthly payroll operations.</p>
  </header>

  <div class="cards-grid">
    @for (module of modules; track module.title) {
      <mat-card>
        <h2>{{ module.title }}</h2>
        <p>{{ module.description }}</p>
        <button mat-flat-button color="primary" [routerLink]="module.route">Open Module</button>
      </mat-card>
    }
  </div>
</section>
